<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7f3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141015" media="(prefers-color-scheme: dark)" />
    <title>Pinky</title>
    <style>
      :root {
        --bg: #fff7f3;
        --ink: #1d1420;
        --muted: #74667a;
        --pink: #f2316f;
        --pink-ink: #ffffff;
        color-scheme: light;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141015;
          --ink: #f7eef2;
          --muted: #a8999f;
          --pink: #ff5a90;
          --pink-ink: #1a0b12;
          color-scheme: dark;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        text-align: center;
      }
      main {
        max-width: 320px;
      }
      svg {
        width: 72px;
        height: 72px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.5;
        margin: 0 0 24px;
      }
      button {
        background: var(--pink);
        color: var(--pink-ink);
        border: 0;
        border-radius: 999px;
        padding: 12px 24px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="128" fill="#f2316f" />
        <g fill="none" stroke="#fff" stroke-width="46" stroke-linecap="round" stroke-linejoin="round">
          <path d="M140 336 V230 A80 80 0 0 1 300 230 V272" />
          <path d="M372 176 V282 A80 80 0 0 1 212 282 V240" />
        </g>
      </svg>
      <h1>You're offline</h1>
      <p>Pinky needs a connection to load your pacts. Today's check-in stays open until midnight.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
